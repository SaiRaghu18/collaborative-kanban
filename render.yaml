services:
  - type: web
    name: kanbanflow-backend
    runtime: node
    rootDir: backend
    plan: free
    region: singapore # or ohio, oregon, frankfurt
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: FRONTEND_URL
        sync: false
